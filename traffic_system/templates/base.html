<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Traffic{% endblock %} · Smart Traffic Congestion Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="/"><i></i> Smart Traffic</a>
  <nav>
    {% set p = request.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Dashboard</a>
    <a href="/predict" class="{{ 'on' if p == '/predict' }}">Predict</a>
    <a href="/trends" class="{{ 'on' if p == '/trends' }}">Trends</a>
    <a href="/peaks" class="{{ 'on' if p == '/peaks' }}">Peak periods</a>
    <a href="/models" class="{{ 'on' if p == '/models' }}">Models</a>
  </nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
